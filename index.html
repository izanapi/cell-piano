<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#11130f" />
<title>POCKET CHORD</title>
<style>
:root{
  --bg:#10120f; --panel:#171a15; --line:#30342b; --text:#ece9d8; --muted:#818676;
  --accent:#d8f065; --glow:rgba(216,240,101,.24);
  --white:#e9e5d8; --white2:#c9c4b7; --black:#20221d; --black2:#0c0d0b;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  inset:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
body{display:flex;justify-content:center}
.app{
  width:min(100vw,520px);
  height:100dvh;
  max-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
}
.topbar{
  flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line)
}
.logo{font-size:12px;letter-spacing:.16em}.state{font-size:9px;color:var(--muted)}
.screen{
  flex:0 0 auto;background:#141710;border:1px solid #3b4033;border-radius:9px;
  padding:9px;box-shadow:inset 0 0 28px rgba(0,0,0,.35)
}
.readouts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cell{
  border:1px solid #33382d;border-radius:6px;padding:7px 8px;min-height:50px;
  position:relative;overflow:hidden;touch-action:none;
}
.cell::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;
}
.cell.dragging{border-color:var(--accent);box-shadow:0 0 12px rgba(216,240,101,.08)}
.cell.dragging::after{background:var(--accent)}
.label{font-size:8px;color:var(--muted);letter-spacing:.1em}
.value{font-size:16px;margin-top:5px;white-space:nowrap}
.value.tiny{font-size:11px}
.hint{position:absolute;right:6px;top:5px;font-size:7px;color:#596050}
.clock{margin-top:8px;display:flex;align-items:center;justify-content:space-between}
.pulse{display:flex;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:#34382f}
.dot.on{background:var(--accent);box-shadow:0 0 10px var(--glow)}

.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:0 0 auto}
button{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:6px;padding:8px 4px;font:inherit;font-size:9px;min-height:36px;touch-action:manipulation
}
button.active,button:active{border-color:var(--accent);color:var(--accent)}

.recbar{display:flex;gap:6px;flex:0 0 auto}.recbar button{flex:1}
.recDot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b84b45;margin-right:5px}
.rec-on .recDot{background:#ff5149;box-shadow:0 0 8px rgba(255,81,73,.6)}

.keyboard-wrap{
  margin-top:auto;
  flex:1 1 auto;
  min-height:285px;
  max-height:410px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#121410;
  padding:8px 8px 10px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.kbd-title{
  flex:0 0 14px;display:flex;justify-content:space-between;
  color:var(--muted);font-size:8px;letter-spacing:.08em;padding:0 2px
}
.piano-row{position:relative;flex:1 1 0;min-height:116px;border:1px solid #252820;border-radius:7px;overflow:hidden;background:#080908;touch-action:none}
.white-keys{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);z-index:1}
.white-key{
  position:relative;background:linear-gradient(#f0ede3 0%,var(--white) 72%,var(--white2) 100%);
  border-right:1px solid #8e8a80;color:#393830;touch-action:none
}
.white-key:last-child{border-right:0}
.white-key.active{background:linear-gradient(#e8f58f,var(--accent))}
.black-key{
  position:absolute;top:0;width:8.6%;height:61%;transform:translateX(-50%);
  background:linear-gradient(#30332c 0%,var(--black) 58%,var(--black2) 100%);
  border:1px solid #050605;border-radius:0 0 4px 4px;z-index:3;
  box-shadow:0 3px 0 #050605;color:#c9c7bb;touch-action:none
}
.black-key.active{background:linear-gradient(#e0ef7a,#91a936);box-shadow:none;color:#17190f}
.note{
  position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  font-size:8px;opacity:.68;pointer-events:none
}
.black-key .note{bottom:4px;font-size:7px}
.row-label{
  position:absolute;left:5px;bottom:4px;z-index:5;font-size:7px;color:#777b6f;pointer-events:none
}
.footer{flex:0 0 12px;font-size:8px;color:#555b50;display:flex;justify-content:space-between;padding:0 2px}

@media(max-height:760px){
  .app{gap:6px}
  .cell{min-height:43px;padding:6px}
  .value{font-size:14px;margin-top:4px}
  .keyboard-wrap{min-height:245px;padding:7px}
  .piano-row{min-height:101px}
  button{min-height:32px;padding:6px 3px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">POCKET CHORD</div>
    <div class="state" id="state">TOUCH TO START</div>
  </div>

  <div class="screen">
    <div class="readouts">
      <div class="cell" data-param="key">
        <div class="label">KEY</div><div class="hint">TAP / DRAG</div><div class="value" id="keyVal">C</div>
      </div>
      <div class="cell" data-param="scale">
        <div class="label">SCALE</div><div class="hint">TAP / DRAG</div><div class="value tiny" id="scaleVal">DORIAN</div>
      </div>
      <div class="cell" data-param="bpm">
        <div class="label">BPM</div><div class="hint">DRAG</div><div class="value" id="bpmVal">84</div>
      </div>
      <div class="cell" data-param="grid">
        <div class="label">GRID</div><div class="hint">TAP / DRAG</div><div class="value tiny" id="gridVal">1/8</div>
      </div>
      <div class="cell" data-param="voice">
        <div class="label">VOICE</div><div class="hint">TAP / DRAG</div><div class="value tiny" id="voiceVal">OPEN</div>
      </div>
      <div class="cell" data-param="memory">
        <div class="label">MEMORY</div><div class="hint">TAP / DRAG</div><div class="value tiny" id="memoryVal">1 STEP</div>
      </div>
    </div>
    <div class="clock"><span class="label">CLOCK</span><div class="pulse"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div>
  </div>

  <div class="controls">
    <button id="sustainBtn">SUSTAIN</button>
    <button id="humanBtn" class="active">SOFT Q</button>
    <button id="mapBtn" class="active">SCALE MAP</button>
    <button id="stopBtn">STOP</button>
    <button id="clearBtn">CLEAR</button>
  </div>

  <div class="recbar">
    <button id="recBtn"><span class="recDot"></span>REC</button>
    <button id="saveBtn" disabled>SAVE TAKE</button>
  </div>

  <div class="keyboard-wrap">
    <div class="kbd-title"><span>PIANO / 1 OCTAVE × 2</span><span id="rangeLabel">C4 — C6</span></div>
    <div class="piano-row" id="pianoLow" data-octave="4"><div class="white-keys"></div><div class="row-label">LOW</div></div>
    <div class="piano-row" id="pianoHigh" data-octave="5"><div class="white-keys"></div><div class="row-label">HIGH</div></div>
  </div>

  <div class="footer"><span>FIXED TOUCH UI / QUANTIZED</span><span>VER 0.5</span></div>
</div>

<script>
let ctx, master, recDest, recorder, chunks=[];
let recording=false, sustain=false, softQ=true, scaleMap=true;
let keyIndex=0, scaleIndex=1, bpm=84, gridIndex=1, voiceIndex=2, memoryIndex=1;
let memory=[];
let clockTimer=null, beat=0;

const roots=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const chromaNames=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const scales=[
 {name:'MAJOR',steps:[0,2,4,5,7,9,11]},
 {name:'DORIAN',steps:[0,2,3,5,7,9,10]},
 {name:'MINOR',steps:[0,2,3,5,7,8,10]},
 {name:'PENTA',steps:[0,2,4,7,9]},
 {name:'WHOLE',steps:[0,2,4,6,8,10]}
];
const grids=[{name:'1/4',div:1},{name:'1/8',div:2},{name:'1/16',div:4},{name:'FREE',div:0}];
const voices=[
 {name:'SINGLE',scaleOffsets:[0]},
 {name:'FIFTH',scaleOffsets:[0,4]},
 {name:'OPEN',scaleOffsets:[0,4,8]},
 {name:'SPREAD',scaleOffsets:[0,4,8,11]},
 {name:'CLUSTER',scaleOffsets:[0,1,2]}
];
const memories=[0,1,2,3];
const whiteSemis=[0,2,4,5,7,9,11,12];
const blackSemis=[
  {s:1,p:12.5},{s:3,p:25},{s:6,p:50},{s:8,p:62.5},{s:10,p:75}
];

function ensureAudio(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();
    master.gain.value=.36;
    master.connect(ctx.destination);

    if(ctx.createMediaStreamDestination){
      recDest=ctx.createMediaStreamDestination();
      master.connect(recDest);
    }
  }
  if(ctx.state==='suspended') ctx.resume();
  document.getElementById('state').textContent='AUDIO ON';
}

function midiHz(m){return 440*Math.pow(2,(m-69)/12)}
function midiName(m){return chromaNames[(m%12+12)%12]+Math.floor(m/12-1)}

function nearestScaleMidi(rawMidi){
  if(!scaleMap) return rawMidi;
  const pc=((rawMidi-60-keyIndex)%12+12)%12;
  const sc=scales[scaleIndex].steps;
  let best=sc[0], bestDist=99;
  for(const step of sc){
    const d=Math.abs(step-pc);
    const wrap=Math.min(d,12-d);
    if(wrap<bestDist){bestDist=wrap;best=step}
  }
  const octave=Math.floor((rawMidi-60-keyIndex)/12);
  let mapped=60+keyIndex+octave*12+best;

  // Pick the nearest octave variant.
  const candidates=[mapped-12,mapped,mapped+12];
  candidates.sort((a,b)=>Math.abs(a-rawMidi)-Math.abs(b-rawMidi));
  return candidates[0];
}

function scaleDegreeMidiFromBase(baseMidi, degreeOffset){
  const sc=scales[scaleIndex].steps;
  const rel=baseMidi-(60+keyIndex);
  let octave=Math.floor(rel/12);
  let pc=((rel%12)+12)%12;

  let degree=0, best=999;
  sc.forEach((s,i)=>{
    const d=Math.min(Math.abs(s-pc),12-Math.abs(s-pc));
    if(d<best){best=d;degree=i}
  });

  const total=degree+degreeOffset;
  octave += Math.floor(total/sc.length);
  const idx=((total%sc.length)+sc.length)%sc.length;
  return 60+keyIndex+octave*12+sc[idx];
}

function currentGridSec(){
  const g=grids[gridIndex].div;
  if(!g) return 0;
  return 60/bpm/g;
}

function quantizedTime(){
  const gs=currentGridSec();
  if(!gs) return ctx.currentTime;
  const t=ctx.currentTime;
  const next=Math.ceil(t/gs)*gs;
  if(!softQ) return next;
  return (next-t<gs*.42)?next:t;
}

function makeVoice(midi,start,dur=.78,level=.12){
  const osc=ctx.createOscillator(), gain=ctx.createGain(), filt=ctx.createBiquadFilter();
  osc.type='triangle';
  osc.frequency.value=midiHz(midi);
  filt.type='lowpass'; filt.frequency.value=1900; filt.Q.value=.6;
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(level,start+.016);
  gain.gain.exponentialRampToValueAtTime(.0001,start+dur);
  osc.connect(filt); filt.connect(gain); gain.connect(master);
  osc.start(start); osc.stop(start+dur+.06);
}

function triggerRawMidi(rawMidi, el){
  ensureAudio();
  const base=nearestScaleMidi(rawMidi);
  const start=quantizedTime();

  voices[voiceIndex].scaleOffsets.forEach((off,i)=>{
    const midi=scaleMap ? scaleDegreeMidiFromBase(base,off) : base + [0,7,12,19][Math.min(i,3)];
    makeVoice(midi,start+i*.016,.82,.11/(1+i*.08));
  });

  if(memories[memoryIndex]>0){
    memory.slice(-memories[memoryIndex]).forEach((m,j)=>{
      makeVoice(m,start+.012*(j+1),.60,.048/(j+1));
    });
  }
  memory.push(base);
  if(memory.length>10) memory.shift();

  el.classList.add('active');
  setTimeout(()=>el.classList.remove('active'),210);
}

function buildPiano(root){
  const octave=Number(root.dataset.octave);
  const baseMidi=12*(octave+1);
  const whites=root.querySelector('.white-keys');
  whites.innerHTML='';
  root.querySelectorAll('.black-key').forEach(x=>x.remove());

  whiteSemis.forEach((semi,i)=>{
    const key=document.createElement('div');
    key.className='white-key';
    key.dataset.midi=baseMidi+semi;
    key.innerHTML=`<span class="note">${midiName(baseMidi+semi)}</span>`;
    bindPianoKey(key);
    whites.appendChild(key);
  });

  blackSemis.forEach(({s,p})=>{
    const key=document.createElement('div');
    key.className='black-key';
    key.style.left=p+'%';
    key.dataset.midi=baseMidi+s;
    key.innerHTML=`<span class="note">${midiName(baseMidi+s)}</span>`;
    bindPianoKey(key);
    root.appendChild(key);
  });
}

function bindPianoKey(el){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    e.stopPropagation();
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    triggerRawMidi(Number(el.dataset.midi),el);
  },{passive:false});
}

function refresh(){
  keyVal.textContent=roots[keyIndex];
  scaleVal.textContent=scales[scaleIndex].name;
  bpmVal.textContent=bpm;
  gridVal.textContent=grids[gridIndex].name;
  voiceVal.textContent=voices[voiceIndex].name;
  memoryVal.textContent=memories[memoryIndex]===0?'OFF':memories[memoryIndex]+' STEP';
  mapBtn.textContent=scaleMap?'SCALE MAP':'CHROMATIC';
  mapBtn.classList.toggle('active',scaleMap);
  rangeLabel.textContent='C4 — C6';
  restartClock();
}

function changeParam(param,dir,amount=1){
  if(dir===0) return;
  if(param==='key'){keyIndex=(keyIndex+dir+12)%12;memory=[]}
  if(param==='scale'){scaleIndex=(scaleIndex+dir+scales.length)%scales.length;memory=[]}
  if(param==='bpm'){
    bpm=Math.max(40,Math.min(180,bpm+dir*Math.max(1,amount)));
  }
  if(param==='grid'){gridIndex=(gridIndex+dir+grids.length)%grids.length}
  if(param==='voice'){voiceIndex=(voiceIndex+dir+voices.length)%voices.length}
  if(param==='memory'){memoryIndex=(memoryIndex+dir+memories.length)%memories.length}
  refresh();
}

function attachParamControl(cell){
  const param=cell.dataset.param;
  let sx=0, sy=0, lastStep=0, moved=false;

  cell.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{cell.setPointerCapture(e.pointerId)}catch(_){}
    sx=e.clientX; sy=e.clientY; lastStep=0; moved=false;
    cell.classList.add('dragging');
    ensureAudio();
  },{passive:false});

  cell.addEventListener('pointermove',e=>{
    if(!cell.hasPointerCapture?.(e.pointerId)) return;
    e.preventDefault();
    const dx=e.clientX-sx;
    const dy=sy-e.clientY;
    const delta=Math.abs(dx)>Math.abs(dy)?dx:dy;
    const stepSize=param==='bpm'?7:26;
    const step=Math.trunc(delta/stepSize);
    if(step!==lastStep){
      const diff=step-lastStep;
      moved=true;
      changeParam(param,Math.sign(diff),param==='bpm'?Math.abs(diff):1);
      lastStep=step;
      if(navigator.vibrate) navigator.vibrate(5);
    }
  },{passive:false});

  const finish=e=>{
    e.preventDefault();
    cell.classList.remove('dragging');
    if(!moved){
      changeParam(param,1,param==='bpm'?2:1);
    }
  };
  cell.addEventListener('pointerup',finish,{passive:false});
  cell.addEventListener('pointercancel',()=>cell.classList.remove('dragging'));
}

document.querySelectorAll('.cell[data-param]').forEach(attachParamControl);

sustainBtn.onclick=()=>{
  sustain=!sustain;
  sustainBtn.classList.toggle('active',sustain);
};
humanBtn.onclick=()=>{
  softQ=!softQ;
  humanBtn.classList.toggle('active',softQ);
  humanBtn.textContent=softQ?'SOFT Q':'HARD Q';
};
mapBtn.onclick=()=>{
  scaleMap=!scaleMap;
  memory=[];
  refresh();
};
stopBtn.onclick=()=>{
  memory=[];
  state.textContent='STOPPED';
};
clearBtn.onclick=()=>{memory=[]};

recBtn.onclick=async()=>{
  ensureAudio();
  if(!recDest || typeof MediaRecorder==='undefined'){
    state.textContent='REC UNSUPPORTED';
    return;
  }
  if(!recording){
    chunks=[];
    let options={};
    if(MediaRecorder.isTypeSupported?.('audio/webm;codecs=opus')) options.mimeType='audio/webm;codecs=opus';
    recorder=new MediaRecorder(recDest.stream,options);
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=()=>{saveBtn.disabled=false};
    recorder.start();
    recording=true;
    recBtn.classList.add('rec-on');
    recBtn.innerHTML='<span class="recDot"></span>STOP REC';
  }else{
    recorder.stop();
    recording=false;
    recBtn.classList.remove('rec-on');
    recBtn.innerHTML='<span class="recDot"></span>REC';
  }
};

saveBtn.onclick=()=>{
  if(!chunks.length)return;
  const type=chunks[0].type||'audio/webm';
  const blob=new Blob(chunks,{type});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='pocket-chord-take.webm';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

function restartClock(){
  if(clockTimer) clearInterval(clockTimer);
  const dots=[...document.querySelectorAll('.dot')];
  const tick=()=>{
    dots.forEach((d,i)=>d.classList.toggle('on',i===beat%4));
    beat=(beat+1)%4;
  };
  tick();
  clockTimer=setInterval(tick,(60/bpm)*1000);
}

// Aggressively prevent browser gestures that interfere with playing.
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('scroll',()=>window.scrollTo(0,0));

buildPiano(pianoLow);
buildPiano(pianoHigh);
refresh();
</script>
</body>
</html>
