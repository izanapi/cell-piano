<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RADIAL / prototype</title>
<style>
  :root{
    --bg:#0a0d10;
    --panel:#11161b;
    --line:#26313a;
    --text:#d8e0e6;
    --muted:#6f7d88;
    --accent:#d7b65b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    overscroll-behavior:none;
  }
  body{
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  #top{
    height:54px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14px;
    letter-spacing:.08em; font-size:12px;
    color:var(--muted);
    flex:0 0 auto;
  }
  #status{ color:var(--text); opacity:.8 }
  #stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }
  canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    touch-action:none;
  }
  #controls{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:12px 14px 14px;
    border-top:1px solid #182028;
    background:linear-gradient(180deg, rgba(17,22,27,.96), rgba(9,12,15,.98));
  }
  .ctl{
    min-width:0;
  }
  .ctl .row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; letter-spacing:.08em; color:var(--muted);
    margin-bottom:7px;
  }
  .ctl .value{ color:var(--text); font-size:10px }
  input[type=range]{
    width:100%;
    appearance:none; -webkit-appearance:none;
    height:22px; background:transparent;
    touch-action:none;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px; background:#35424d;
  }
  input[type=range]::-webkit-slider-thumb{
    appearance:none; -webkit-appearance:none;
    width:20px; height:20px; border-radius:50%;
    margin-top:-9px;
    background:#c8d1d8; border:5px solid #10151a;
    box-shadow:0 0 0 1px #3b4650;
  }
  #hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:11px; letter-spacing:.06em; color:#77848e;
    pointer-events:none; text-align:center; line-height:1.7;
    transition:opacity .4s ease;
  }
  #version{
    position:absolute; left:14px; bottom:8px;
    font-size:9px; color:#45515b; pointer-events:none;
  }
</style>
</head>
<body>
  <div id="top">
    <div>RADIAL INSTRUMENT</div>
    <div id="status">TOUCH TO START</div>
  </div>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint">touch / drag anywhere<br>neighbors are fifth-related</div>
    <div id="version">PROTO 0.1</div>
  </div>

  <div id="controls">
    <div class="ctl">
      <div class="row"><span>ECHO</span><span class="value" id="echoVal">0</span></div>
      <input id="echo" type="range" min="0" max="100" value="0">
    </div>
    <div class="ctl">
      <div class="row"><span>HALL</span><span class="value" id="hallVal">10</span></div>
      <input id="hall" type="range" min="0" max="100" value="10">
    </div>
    <div class="ctl">
      <div class="row"><span>VOLUME</span><span class="value" id="volVal">80</span></div>
      <input id="vol" type="range" min="0" max="100" value="80">
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx2d = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  const hint = document.getElementById('hint');

  const echoSlider = document.getElementById('echo');
  const hallSlider = document.getElementById('hall');
  const volSlider  = document.getElementById('vol');
  const echoVal = document.getElementById('echoVal');
  const hallVal = document.getElementById('hallVal');
  const volVal = document.getElementById('volVal');

  let dpr=1, W=0, H=0, cx=0, cy=0, R=0;
  const N = 24;
  const layers = [
    {name:'BASS',  color:'#d6a84b'},
    {name:'PLUCK', color:'#b9cf60'},
    {name:'BELL',  color:'#6fd0b3'},
    {name:'AIR',   color:'#70c6d8'}
  ];
  // circle-of-fifths order; adjacent sectors always harmonically friendly
  const fifthCycle = [0,7,2,9,4,11,6,1,8,3,10,5]; // C G D A E B F# C# Ab Eb Bb F
  const fifthNames = ['C','G','D','A','E','B','F#','C#','Ab','Eb','Bb','F'];
  const pitchClasses = Array.from({length:N}, (_,i) => fifthCycle[i % 12]);
  const pitchNames   = Array.from({length:N}, (_,i) => fifthNames[i % 12]);

  const energy = Array.from({length:4},()=>Array(N).fill(0));
  const activePointers = new Map();

  let audio=null, master=null, dry=null, delay=null, feedback=null, echoWet=null, convolver=null, hallWet=null;
  let started=false;

  function resize(){
    const r = stage.getBoundingClientRect();
    dpr = Math.max(1, Math.min(3, devicePixelRatio||1));
    W = Math.floor(r.width*dpr); H = Math.floor(r.height*dpr);
    canvas.width=W; canvas.height=H;
    canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px';
    cx=W/2;
    cy=H/2 + 4*dpr;
    R=Math.min(W,H)*0.42;
  }
  addEventListener('resize', resize, {passive:true});
  resize();

  function initAudio(){
    if(audio) return;
    audio = new (window.AudioContext||window.webkitAudioContext)();

    master = audio.createGain();
    dry = audio.createGain();
    delay = audio.createDelay(1.5);
    feedback = audio.createGain();
    echoWet = audio.createGain();
    convolver = audio.createConvolver();
    hallWet = audio.createGain();

    // short synthetic hall impulse
    const len = Math.floor(audio.sampleRate*2.4);
    const impulse = audio.createBuffer(2, len, audio.sampleRate);
    for(let ch=0; ch<2; ch++){
      const data=impulse.getChannelData(ch);
      for(let i=0;i<len;i++){
        const t=i/len;
        data[i]=(Math.random()*2-1)*Math.pow(1-t,2.6);
      }
    }
    convolver.buffer=impulse;

    dry.connect(master);
    dry.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(echoWet);
    echoWet.connect(master);

    dry.connect(convolver);
    convolver.connect(hallWet);
    hallWet.connect(master);

    master.connect(audio.destination);
    updateFX();
  }

  function updateFX(){
    if(!audio) return;
    const e=+echoSlider.value/100;
    const h=+hallSlider.value/100;
    const v=+volSlider.value/100;
    delay.delayTime.setTargetAtTime(0.28, audio.currentTime, .01);
    feedback.gain.setTargetAtTime(e*0.66, audio.currentTime, .02);
    echoWet.gain.setTargetAtTime(e*0.65, audio.currentTime, .02);
    hallWet.gain.setTargetAtTime(h*0.75, audio.currentTime, .02);
    master.gain.setTargetAtTime(v*0.9, audio.currentTime, .02);
  }

  function midiFreq(m){ return 440*Math.pow(2,(m-69)/12); }

  function noteFor(layer, sector){
    // each radial layer has its own register
    const pc = pitchClasses[sector];
    const baseOct = [2,4,5,5][layer];
    // 24 spokes = two turns of the circle of fifths. The second turn sits one octave higher.
    const octaveLift = sector >= 12 ? 12 : 0;
    return 12*(baseOct+1)+pc+octaveLift;
  }

  function play(layer, sector, velocity=1){
    initAudio();
    if(audio.state==='suspended') audio.resume();

    const now=audio.currentTime;
    const midi=noteFor(layer,sector);
    const f=midiFreq(midi);
    const out=audio.createGain();
    out.gain.setValueAtTime(0, now);
    out.connect(dry);

    if(layer===0){ // BASS
      const o=audio.createOscillator(), filt=audio.createBiquadFilter();
      o.type='triangle'; o.frequency.value=f;
      filt.type='lowpass'; filt.frequency.value=700; filt.Q.value=.7;
      o.connect(filt); filt.connect(out);
      out.gain.linearRampToValueAtTime(.28*velocity,now+.012);
      out.gain.exponentialRampToValueAtTime(.0008,now+1.15);
      o.start(now); o.stop(now+1.2);
    }
    else if(layer===1){ // PLUCK
      const o=audio.createOscillator(), filt=audio.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=f;
      filt.type='lowpass'; filt.frequency.setValueAtTime(2500,now);
      filt.frequency.exponentialRampToValueAtTime(450,now+.55);
      o.connect(filt); filt.connect(out);
      out.gain.linearRampToValueAtTime(.18*velocity,now+.004);
      out.gain.exponentialRampToValueAtTime(.0008,now+.75);
      o.start(now); o.stop(now+.8);
    }
    else if(layer===2){ // BELL
      [1,2.01,3.97].forEach((mul,i)=>{
        const o=audio.createOscillator(), g=audio.createGain();
        o.type='sine'; o.frequency.value=f*mul;
        g.gain.value=[1,.35,.12][i];
        o.connect(g); g.connect(out);
        o.start(now); o.stop(now+1.7);
      });
      out.gain.linearRampToValueAtTime(.16*velocity,now+.003);
      out.gain.exponentialRampToValueAtTime(.0008,now+1.6);
    }
    else { // AIR
      const len=Math.floor(audio.sampleRate*.22);
      const b=audio.createBuffer(1,len,audio.sampleRate);
      const d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const src=audio.createBufferSource(), bp=audio.createBiquadFilter();
      src.buffer=b; bp.type='bandpass'; bp.frequency.value=Math.max(700,f*2.3); bp.Q.value=5;
      src.connect(bp); bp.connect(out);
      out.gain.linearRampToValueAtTime(.10*velocity,now+.006);
      out.gain.exponentialRampToValueAtTime(.0008,now+.34);
      src.start(now);
    }
    energy[layer][sector]=1;
  }

  function locate(clientX, clientY){
    const r=canvas.getBoundingClientRect();
    const x=(clientX-r.left)*dpr, y=(clientY-r.top)*dpr;
    const dx=x-cx, dy=y-cy;
    const dist=Math.hypot(dx,dy);
    if(dist<R*.14 || dist>R*1.06) return null;
    let a=Math.atan2(dy,dx)+Math.PI/2;
    if(a<0) a+=Math.PI*2;
    const sector=Math.floor((a/(Math.PI*2))*N)%N;
    const norm=(dist-R*.14)/(R*.92);
    const layer=Math.max(0,Math.min(3,Math.floor(norm*4)));
    return {layer,sector,x,y,dist};
  }

  function handlePoint(id,x,y){
    const hit=locate(x,y);
    if(!hit) return;
    const last=activePointers.get(id);
    const key=hit.layer+':'+hit.sector;
    if(!last || last.key!==key){
      play(hit.layer, hit.sector, 1);
      activePointers.set(id,{key,hit});
    } else {
      activePointers.set(id,{key,hit});
    }
  }

  canvas.addEventListener('pointerdown', e=>{
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    if(!started){
      started=true;
      hint.style.opacity=0;
      status.textContent='LIVE';
    }
    handlePoint(e.pointerId,e.clientX,e.clientY);
  });
  canvas.addEventListener('pointermove', e=>{
    if(e.buttons===0 && e.pointerType!=='touch') return;
    e.preventDefault();
    if(activePointers.has(e.pointerId)) handlePoint(e.pointerId,e.clientX,e.clientY);
  });
  const end=e=>{ activePointers.delete(e.pointerId); };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  function ringBounds(layer){
    const inner=R*(.14 + layer*.23);
    const outer=R*(.14 + (layer+1)*.23);
    return {inner,outer};
  }

  function draw(){
    ctx2d.clearRect(0,0,W,H);
    ctx2d.fillStyle='#0a0d10';
    ctx2d.fillRect(0,0,W,H);

    // faint outer guide
    ctx2d.save();
    ctx2d.translate(cx,cy);

    // sectors/rings
    for(let l=0;l<4;l++){
      const {inner,outer}=ringBounds(l);
      ctx2d.beginPath();
      ctx2d.arc(0,0,outer,0,Math.PI*2);
      ctx2d.strokeStyle='#1d2730';
      ctx2d.lineWidth=1*dpr;
      ctx2d.stroke();

      // layer name
      ctx2d.fillStyle='#5d6973';
      ctx2d.font=`${9*dpr}px ui-monospace, monospace`;
      ctx2d.textAlign='center';
      ctx2d.fillText(layers[l].name,0,-(inner+outer)/2+3*dpr);
    }

    for(let s=0;s<N;s++){
      const a=-Math.PI/2+s*(Math.PI*2/N);
      const ux=Math.cos(a), uy=Math.sin(a);

      // grid spoke
      ctx2d.beginPath();
      ctx2d.moveTo(ux*R*.14,uy*R*.14);
      ctx2d.lineTo(ux*R*1.06,uy*R*1.06);
      ctx2d.strokeStyle='#26313a';
      ctx2d.lineWidth=1*dpr;
      ctx2d.stroke();

      // pitch label
      const tx=ux*R*1.11, ty=uy*R*1.11;
      ctx2d.fillStyle='#93a0aa';
      ctx2d.font=`${8*dpr}px ui-monospace, monospace`;
      ctx2d.textAlign='center';
      ctx2d.textBaseline='middle';
      ctx2d.fillText(pitchNames[s],tx,ty);

      // growing rays, one per layer
      for(let l=0;l<4;l++){
        energy[l][s]*=.965;
        const e=energy[l][s];
        if(e<.01) continue;
        const {inner,outer}=ringBounds(l);
        const mid=(inner+outer)/2;
        const len=(outer-inner)*(.22 + e*.72);
        ctx2d.beginPath();
        ctx2d.moveTo(ux*(mid-len*.5),uy*(mid-len*.5));
        ctx2d.lineTo(ux*(mid+len*.5),uy*(mid+len*.5));
        ctx2d.strokeStyle=layers[l].color;
        ctx2d.globalAlpha=.25+.75*e;
        ctx2d.lineWidth=(1.2+2.2*e)*dpr;
        ctx2d.lineCap='round';
        ctx2d.shadowColor=layers[l].color;
        ctx2d.shadowBlur=14*dpr*e;
        ctx2d.stroke();
        ctx2d.shadowBlur=0;
        ctx2d.globalAlpha=1;
      }
    }

    // center sun
    const g=ctx2d.createRadialGradient(0,0,0,0,0,R*.12);
    g.addColorStop(0,'rgba(245,210,105,.95)');
    g.addColorStop(.3,'rgba(211,169,69,.55)');
    g.addColorStop(1,'rgba(211,169,69,0)');
    ctx2d.fillStyle=g;
    ctx2d.beginPath();
    ctx2d.arc(0,0,R*.12,0,Math.PI*2);
    ctx2d.fill();

    // active touch markers
    for(const p of activePointers.values()){
      const h=p.hit;
      ctx2d.beginPath();
      ctx2d.arc(h.x-cx,h.y-cy,8*dpr,0,Math.PI*2);
      ctx2d.fillStyle='rgba(235,241,245,.75)';
      ctx2d.fill();
    }
    ctx2d.restore();

    requestAnimationFrame(draw);
  }
  draw();

  [echoSlider,hallSlider,volSlider].forEach(sl=>{
    sl.addEventListener('input',()=>{
      echoVal.textContent=echoSlider.value;
      hallVal.textContent=hallSlider.value;
      volVal.textContent=volSlider.value;
      updateFX();
    },{passive:true});
  });

  // prevent page gestures
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  document.addEventListener('touchmove',e=>{
    if(e.target.tagName!=='INPUT') e.preventDefault();
  },{passive:false});
})();
</script>
</body>
</html>
