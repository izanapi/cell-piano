<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RADIAL / prototype</title>
<style>
:root{
  --bg:#090c0f; --panel:#10151a; --line:#26313a; --text:#dce4e9; --muted:#66747f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
}
body{
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
#top{
  height:50px;flex:0 0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between;
  font-size:11px;letter-spacing:.08em;color:var(--muted);
}
#status{color:#dce4e9}
#stage{position:relative;flex:1 1 auto;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:10px;line-height:1.75;letter-spacing:.05em;text-align:center;color:#7a8790;
  pointer-events:none;transition:opacity .35s ease;
}
#version{position:absolute;left:14px;bottom:8px;font-size:9px;color:#44505a;pointer-events:none}
#controls{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:12px 14px 14px;border-top:1px solid #182028;background:#0e1317;
}
.ctl .row{display:flex;justify-content:space-between;margin-bottom:7px;font-size:10px;letter-spacing:.07em;color:var(--muted)}
.ctl .value{color:var(--text)}
input[type=range]{width:100%;height:22px;appearance:none;-webkit-appearance:none;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#34414b}
input[type=range]::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-9px;
  background:#ccd4da;border:5px solid #10151a;box-shadow:0 0 0 1px #3a4650;
}
</style>
</head>
<body>
<div id="top"><div>RADIAL INSTRUMENT</div><div id="status">TOUCH TO START</div></div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hint">touch anywhere<br>inner area blooms into several notes</div>
  <div id="version">PROTO 0.2</div>
</div>
<div id="controls">
  <div class="ctl"><div class="row"><span>ECHO</span><span class="value" id="echoVal">0</span></div><input id="echo" type="range" min="0" max="100" value="0"></div>
  <div class="ctl"><div class="row"><span>HALL</span><span class="value" id="hallVal">10</span></div><input id="hall" type="range" min="0" max="100" value="10"></div>
  <div class="ctl"><div class="row"><span>VOLUME</span><span class="value" id="volVal">80</span></div><input id="vol" type="range" min="0" max="100" value="80"></div>
</div>

<script>
(()=>{
const canvas=document.getElementById('c'), g=canvas.getContext('2d'), stage=document.getElementById('stage');
const status=document.getElementById('status'), hint=document.getElementById('hint');
const echo=document.getElementById('echo'), hall=document.getElementById('hall'), vol=document.getElementById('vol');
const echoVal=document.getElementById('echoVal'), hallVal=document.getElementById('hallVal'), volVal=document.getElementById('volVal');

const N=24;
const layers=[
 {name:'BASS', color:'#d9ae55'},
 {name:'PLUCK',color:'#bad465'},
 {name:'BELL', color:'#6fd2b9'},
 {name:'AIR',  color:'#74c8db'}
];
const fifthCycle=[0,7,2,9,4,11,6,1,8,3,10,5];
const pitchClasses=Array.from({length:N},(_,i)=>fifthCycle[i%12]);

let dpr=1,W=0,H=0,cx=0,cy=0,R=0;
let audio,master,dry,delay,feedback,echoWet,convolver,hallWet;
let started=false;
const activePointers=new Map();
const energy=Array.from({length:4},()=>Array(N).fill(0));

/* deterministic little rays: visual satellites between the 24 main spokes */
let seed=73191;
function rnd(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
const satellites=Array.from({length:170},()=>{
  const sector=Math.floor(rnd()*N);
  const jitter=(rnd()-.5)*(Math.PI*2/N)*.92;
  const angle=-Math.PI/2+sector*(Math.PI*2/N)+jitter;
  const start=.13+rnd()*.47;
  const length=.06+rnd()*.28;
  const width=.35+rnd()*.65;
  const alpha=.16+rnd()*.28;
  return {sector,angle,start,length,width,alpha};
});

function resize(){
 const r=stage.getBoundingClientRect();
 dpr=Math.max(1,Math.min(3,devicePixelRatio||1));
 W=Math.floor(r.width*dpr);H=Math.floor(r.height*dpr);
 canvas.width=W;canvas.height=H;
 cx=W/2;cy=H/2+2*dpr;R=Math.min(W,H)*.43;
}
addEventListener('resize',resize,{passive:true}); resize();

function makeImpulse(ctx,seconds=2.4){
 const len=Math.floor(ctx.sampleRate*seconds), b=ctx.createBuffer(2,len,ctx.sampleRate);
 for(let ch=0;ch<2;ch++){
   const d=b.getChannelData(ch);
   for(let i=0;i<len;i++){ const t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,2.8); }
 }
 return b;
}
function initAudio(){
 if(audio) return;
 audio=new (window.AudioContext||window.webkitAudioContext)();
 master=audio.createGain(); dry=audio.createGain(); delay=audio.createDelay(1.2);
 feedback=audio.createGain(); echoWet=audio.createGain(); convolver=audio.createConvolver(); hallWet=audio.createGain();
 convolver.buffer=makeImpulse(audio);
 dry.connect(master);
 dry.connect(delay); delay.connect(feedback); feedback.connect(delay); delay.connect(echoWet); echoWet.connect(master);
 dry.connect(convolver); convolver.connect(hallWet); hallWet.connect(master);
 master.connect(audio.destination);
 updateFX();
}
async function ensureAudio(){
 initAudio();
 if(audio.state!=='running'){
   try{ await audio.resume(); }catch(e){}
 }
 status.textContent=audio.state==='running'?'LIVE':'TAP AGAIN';
 return audio.state==='running';
}
function updateFX(){
 if(!audio)return;
 const e=+echo.value/100,h=+hall.value/100,v=+vol.value/100,now=audio.currentTime;
 delay.delayTime.setTargetAtTime(.27,now,.01);
 feedback.gain.setTargetAtTime(e*.62,now,.02);
 echoWet.gain.setTargetAtTime(e*.58,now,.02);
 hallWet.gain.setTargetAtTime(h*.82,now,.02);
 master.gain.setTargetAtTime(v*.95,now,.02);
}
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}
function midiFor(layer,sector){
 const pc=pitchClasses[(sector+N)%N];
 const base=[2,4,5,5][layer];
 const octaveLift=((sector+N)%N)>=12?12:0;
 return 12*(base+1)+pc+octaveLift;
}

function synth(layer,sector,velocity=.8){
 if(!audio||audio.state!=='running')return;
 const now=audio.currentTime,f=midiFreq(midiFor(layer,sector));
 const out=audio.createGain(); out.gain.value=0; out.connect(dry);

 if(layer===0){
   const o=audio.createOscillator(),lp=audio.createBiquadFilter();
   o.type='triangle';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=620;
   o.connect(lp);lp.connect(out);
   out.gain.linearRampToValueAtTime(.21*velocity,now+.008);out.gain.exponentialRampToValueAtTime(.0008,now+.95);
   o.start(now);o.stop(now+1.0);
 }else if(layer===1){
   const o=audio.createOscillator(),lp=audio.createBiquadFilter();
   o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.setValueAtTime(2500,now);lp.frequency.exponentialRampToValueAtTime(520,now+.45);
   o.connect(lp);lp.connect(out);
   out.gain.linearRampToValueAtTime(.13*velocity,now+.004);out.gain.exponentialRampToValueAtTime(.0008,now+.62);
   o.start(now);o.stop(now+.67);
 }else if(layer===2){
   [1,2.01,3.98].forEach((mul,i)=>{const o=audio.createOscillator(),gg=audio.createGain();o.type='sine';o.frequency.value=f*mul;gg.gain.value=[1,.28,.09][i];o.connect(gg);gg.connect(out);o.start(now);o.stop(now+1.35)});
   out.gain.linearRampToValueAtTime(.12*velocity,now+.003);out.gain.exponentialRampToValueAtTime(.0008,now+1.3);
 }else{
   const len=Math.floor(audio.sampleRate*.16),b=audio.createBuffer(1,len,audio.sampleRate),d=b.getChannelData(0);
   for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
   const src=audio.createBufferSource(),bp=audio.createBiquadFilter();src.buffer=b;bp.type='bandpass';bp.frequency.value=Math.max(900,f*2.4);bp.Q.value=4.5;
   src.connect(bp);bp.connect(out);
   out.gain.linearRampToValueAtTime(.065*velocity,now+.003);out.gain.exponentialRampToValueAtTime(.0008,now+.27);src.start(now);
 }
 energy[layer][(sector+N)%N]=Math.max(energy[layer][(sector+N)%N],velocity);
}

function locate(clientX,clientY){
 const r=canvas.getBoundingClientRect(),x=(clientX-r.left)*dpr,y=(clientY-r.top)*dpr;
 const dx=x-cx,dy=y-cy,dist=Math.hypot(dx,dy);
 if(dist>R*1.06)return null;
 let a=Math.atan2(dy,dx)+Math.PI/2;if(a<0)a+=Math.PI*2;
 const sector=Math.round((a/(Math.PI*2))*N)%N;
 const radial=Math.max(0,Math.min(1,dist/(R*1.02)));
 const layer=Math.min(3,Math.floor(radial*4));
 return {x,y,dist,radial,sector,layer};
}

function chordShape(hit){
 /* The closer to the center, the less precise the instrument becomes, intentionally. */
 let offsets, velocities;
 if(hit.radial<.22){
   offsets=[-2,-1,0,1,2]; velocities=[.28,.48,1,.48,.28];
 }else if(hit.radial<.43){
   offsets=[-1,0,1]; velocities=[.38,1,.38];
 }else{
   offsets=[0]; velocities=[1];
 }
 /* inner core also leaks upward into the next timbre layer */
 const result=[];
 offsets.forEach((off,i)=>result.push({layer:hit.layer,sector:hit.sector+off,vel:velocities[i]}));
 if(hit.radial<.25){
   result.push({layer:Math.min(3,hit.layer+1),sector:hit.sector,vel:.34});
 }
 return result;
}

async function triggerHit(hit){
 const ok=await ensureAudio(); if(!ok)return;
 chordShape(hit).forEach(n=>synth(n.layer,n.sector,n.vel));
}

function handlePoint(id,x,y){
 const hit=locate(x,y);if(!hit)return;
 const quant=Math.floor(hit.radial*12);
 const key=hit.sector+':'+quant;
 const last=activePointers.get(id);
 if(!last||last.key!==key){
   triggerHit(hit);
   activePointers.set(id,{key,hit});
 }else activePointers.set(id,{key,hit});
}

canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();
 canvas.setPointerCapture?.(e.pointerId);
 if(!started){started=true;hint.style.opacity=0;}
 handlePoint(e.pointerId,e.clientX,e.clientY);
},{passive:false});
canvas.addEventListener('pointermove',e=>{
 e.preventDefault();
 if(activePointers.has(e.pointerId))handlePoint(e.pointerId,e.clientX,e.clientY);
},{passive:false});
['pointerup','pointercancel','pointerleave'].forEach(ev=>canvas.addEventListener(ev,e=>activePointers.delete(e.pointerId)));

function ringR(i){return R*(.12+i*.225)}
function draw(){
 g.clearRect(0,0,W,H);g.fillStyle='#090c0f';g.fillRect(0,0,W,H);
 g.save();g.translate(cx,cy);

 /* quiet layer circles */
 for(let i=1;i<=4;i++){
   g.beginPath();g.arc(0,0,ringR(i),0,Math.PI*2);g.strokeStyle='#182129';g.lineWidth=.8*dpr;g.stroke();
 }

 /* small randomized rays, denser and shorter than the main 24 */
 satellites.forEach(s=>{
   const u=Math.cos(s.angle),v=Math.sin(s.angle);
   const a=R*s.start,b=R*Math.min(1.02,s.start+s.length);
   const pulse=energy[Math.min(3,Math.floor(s.start*4))][s.sector]||0;
   g.beginPath();g.moveTo(u*a,v*a);g.lineTo(u*b,v*b);
   g.strokeStyle=pulse>.08?layers[Math.min(3,Math.floor(s.start*4))].color:'#6b5937';
   g.globalAlpha=s.alpha+pulse*.45;g.lineWidth=(s.width+pulse*.8)*dpr;g.lineCap='round';g.stroke();g.globalAlpha=1;
 });

 /* 24 main spokes */
 for(let s=0;s<N;s++){
   const a=-Math.PI/2+s*Math.PI*2/N,u=Math.cos(a),v=Math.sin(a);
   const maxE=Math.max(...energy.map(row=>row[s]));
   g.beginPath();g.moveTo(u*R*.08,v*R*.08);g.lineTo(u*R*1.02,v*R*1.02);
   g.strokeStyle=maxE>.03?layers[energy.map(r=>r[s]).indexOf(maxE)].color:'#9b7c42';
   g.globalAlpha=.28+maxE*.72;g.lineWidth=(1.0+1.3*maxE)*dpr;g.lineCap='round';
   if(maxE>.15){g.shadowColor=g.strokeStyle;g.shadowBlur=9*dpr*maxE}
   g.stroke();g.shadowBlur=0;g.globalAlpha=1;

   for(let l=0;l<4;l++)energy[l][s]*=.955;
 }

 /* central glowing ambiguity field */
 const grad=g.createRadialGradient(0,0,0,0,0,R*.24);
 grad.addColorStop(0,'rgba(239,201,102,.88)');
 grad.addColorStop(.30,'rgba(208,164,68,.32)');
 grad.addColorStop(1,'rgba(208,164,68,0)');
 g.fillStyle=grad;g.beginPath();g.arc(0,0,R*.24,0,Math.PI*2);g.fill();

 for(const p of activePointers.values()){
   const h=p.hit;
   g.beginPath();g.arc(h.x-cx,h.y-cy,7*dpr,0,Math.PI*2);g.fillStyle='rgba(239,244,247,.7)';g.fill();
 }
 g.restore();requestAnimationFrame(draw);
}
draw();

[echo,hall,vol].forEach(sl=>sl.addEventListener('input',()=>{
 echoVal.textContent=echo.value;hallVal.textContent=hall.value;volVal.textContent=vol.value;updateFX();
},{passive:true}));

document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
})();
</script>
</body>
</html>
